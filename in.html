<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            background-color: rgb(32, 32, 32);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        header{
            display: flex;
            justify-content: space-between; 
        }
        h1{
            color: aliceblue;
        }
        h2{
            color: aliceblue;
        }
        main{
            height: 590px;
            overflow-x: auto;
            display: flex;
            flex-flow: row wrap;
        }
        .scroll{
            width: 500px;
            display: flex;
            justify-content: flex-start;
            gap: 30px;
        }
        .column {
            display: flex;
            flex-flow: row wrap;
            width: 230px;
            gap: 10px;
        }
        .column0 > div{
            background:rgb(255, 0, 0);
        }
        .column1{
            flex-flow: row-reverse wrap;
        }
        .column1 > div{
            background:rgb(255, 153, 0);
        }
        .column2 > div{
            background:rgb(60, 255, 0);
        }
        .column3{
            flex-flow: row-reverse wrap;
        }
        .column3 > div{
            background:rgb(0, 255, 191);
        }
        .column4{
            display: flex;
            flex-flow: row wrap;
        }
        .column4 > div{
            background:rgb(0, 47, 255);
        }
        .column5{
            display: flex;
            flex-flow: row-reverse wrap;
        }
        .column5 > div{
            background:rgb(153, 0, 255);
        }
        .column6 > div {
            background:rgb(255, 0, 98);
        }
        .column6 {
            width: 460px;
            display: flex;
            flex-flow: row wrap;
        }
        .small {
            height: 100px;
            flex-basis: calc(50% - 5px);
        }
        .middle{
            height: 100px;
            flex-basis: calc(100%);
        }
        .big{
            height: 210px;
            flex-basis: calc(100%);
        }
        .small6{
            height: 100px;
            flex-basis: calc(25% - 7.5px);
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Start</h1>
        <h2>User</h2>
    </header>
    <main>
        <div class="scroll">
            <div class="group">
                <div class="column column0">
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="middle"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                </div>
            </div>
            <div class="group">
                <div class="column column1">
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="middle"></div>
                    <div class="small"></div>
                </div>
            </div>
            <div class="group">
                <div class="column column2">
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="middle"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                </div>
            </div>
            <div class="group">
                <div class="column column3">
                    <div class="middle"></div>
                    <div class="big"></div>
                    <div class="small"></div>
                </div>
            </div>
            <div class="group">
                <div class="column column4">
                    <div class="big"></div>
                    <div class="middle"></div>
                    <div class="small"></div>
                </div>
            </div>
            <div class="group">
                <div class="column column5">
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="middle"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                    <div class="small"></div>
                </div>
            </div>
            <div class="group">
                <div class="column column6">
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                    <div class="small6"></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
